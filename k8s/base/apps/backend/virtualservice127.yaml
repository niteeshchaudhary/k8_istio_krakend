apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: backend-127
spec:
  gateways:
    - cluster-infra/main-gateway
  hosts:
    - "*"
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: backend.backend.svc.cluster.local
            port:
              number: 8093
