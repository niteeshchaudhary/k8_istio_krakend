apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        sidecar.istio.io/inject: "true" # Ensure Istio sidecar is injected
    spec:
      containers:
      - name: backend
        image: niteesh20/myapp-backend:latest
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "postgres"
        - name: APP_AUTH_REQUIRED
          value: "false"
        - name: APP_GATEWAY_AUTH
          value: "true"
        - name: KEYCLOAK_SERVER_URL
          value: "http://keycloak.keycloak.svc.cluster.local:8080"
        - name: KEYCLOAK_REALM
          value: "debateapp"
        - name: KEYCLOAK_BACKEND_CLIENT_ID
          value: "debateapp-backend"
        - name: KEYCLOAK_BACKEND_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-backend-secret
              key: client-secret
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://pg-cluster-rw.postgres.svc:5432/appuser"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: shared-db-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shared-db-secret
              key: password
        ports:
        - containerPort: 8093
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
