apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: frontend
        image: niteesh20/myapp-frontend:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          if [ "${VITE_ROUTE_PREFIX}" != "/" ]; then
            mkdir -p /usr/share/nginx/html${VITE_ROUTE_PREFIX}
            cp -rn /usr/share/nginx/html/* /usr/share/nginx/html${VITE_ROUTE_PREFIX} || true
            find /usr/share/nginx/html${VITE_ROUTE_PREFIX} -type f \( -name "*.html" -o -name "*.js" \) -exec sed -i "s|/assets/|${VITE_ROUTE_PREFIX}assets/|g" {} +
            HTML_DIR="/usr/share/nginx/html${VITE_ROUTE_PREFIX}"
            INDEX_FALLBACK="${VITE_ROUTE_PREFIX}index.html"
          else
            HTML_DIR="/usr/share/nginx/html"
            INDEX_FALLBACK="/index.html"
          fi
          sed -i "s|%%VITE_ROUTE_PREFIX%%|${VITE_ROUTE_PREFIX}|g" ${HTML_DIR}/index.html
          sed -i "s|%%VITE_API_BASE_URL%%|${VITE_API_BASE_URL}|g" ${HTML_DIR}/index.html
          sed -i "s|%%VITE_WS_URL%%|${VITE_WS_URL}|g" ${HTML_DIR}/index.html
          sed -i "s|%%VITE_INDEX_FALLBACK%%|${INDEX_FALLBACK}|g" /etc/nginx/conf.d/default.conf
          nginx -g 'daemon off;'
        ports:
        - containerPort: 80
        env:
        - name: VITE_ROUTE_PREFIX
          value: /
        # /125/api → Istio 1.25 gateway → KrakenD → backend (OIDC validated at gateway)
        # /127/api → Istio 1.27 gateway → KrakenD (same auth path, no direct backend bypass)
        - name: VITE_API_BASE_URL
          value: /125/api
        - name: VITE_WS_URL
          value: /125/ws
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
