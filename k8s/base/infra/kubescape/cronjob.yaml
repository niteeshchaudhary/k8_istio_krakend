apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubescape
  namespace: kubescape
spec:
  # Weekly, offset from the kube-bench run (daily 03:00) so the two scans don't
  # compete for API server attention. Adjust per environment if needed.
  schedule: "0 4 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 12
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kubescape
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: kubescape
          restartPolicy: Never
          initContainers:
            - name: kubescape-metrics
              image: quay.io/kubescape/kubescape-cli:v4.0.13
              command:
                - kubescape
                - scan
                - --keep-local
                - --host-scan=false
                - --format
                - prometheus
                - --output
                - /results/metrics.prom
                # kubescape's prometheus formatter appends .txt to whatever --output path
                # is given, regardless of the extension already present, so the file that
                # actually lands on disk is /results/metrics.prom.txt.
              env:
                - name: HOME
                  value: /home/kubescape
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: results
                  mountPath: /results
                - name: home
                  mountPath: /home/kubescape
            - name: push-metrics
              image: docker.io/curlimages/curl:8.10.1
              command:
                - sh
                - -c
                - |
                  set -eu
                  GATEWAY_URL="http://kubescape-pushgateway.kubescape.svc.cluster.local:9091/metrics/job/kubescape/instance/cluster"

                  # kubescape's prometheus formatter sometimes embeds a literal newline
                  # inside a label value (e.g. a multi-line control description) instead
                  # of escaping it as \n, which splits one logical sample across two
                  # physical lines and breaks Pushgateway's line-based parser. Rejoin any
                  # line left with an unterminated quoted string, escaping the embedded
                  # newline properly, before pushing.
                  awk '
                    { line = pending ? acc "\\n" $0 : $0
                      q = gsub(/"/, "&", line)
                      if (q % 2 == 0) { print line; pending = 0; acc = "" }
                      else { acc = line; pending = 1 }
                    }
                    END { if (pending) print acc }
                  ' /results/metrics.prom.txt > /results/metrics.step1.prom

                  # kubescape also emits the same metric name + label set more than once
                  # with different values for kubescape_resource_count_controls_* (e.g. one
                  # count per framework evaluated against the same resource, with no label
                  # to tell them apart), which Pushgateway rejects as a duplicate series.
                  # Keep only the last value seen for each unique name+labels combination.
                  awk '
                    { line[NR] = $0
                      if ($0 !~ /^#/ && $0 !~ /^[ \t]*$/) {
                        key = $0; sub(/[ \t]+[^ \t]+$/, "", key)
                        lastidx[key] = NR
                      }
                    }
                    END {
                      for (i = 1; i <= NR; i++) {
                        if (line[i] ~ /^#/ || line[i] ~ /^[ \t]*$/) { print line[i]; continue }
                        key = line[i]; sub(/[ \t]+[^ \t]+$/, "", key)
                        if (lastidx[key] == i) print line[i]
                      }
                    }
                  ' /results/metrics.step1.prom > /results/metrics.pushgateway.prom

                  HTTP_STATUS=$(curl -s -o /tmp/response.txt -w '%{http_code}' \
                    --data-binary @/results/metrics.pushgateway.prom "$GATEWAY_URL")
                  if [ "$HTTP_STATUS" -ge 300 ]; then
                    echo "Pushgateway rejected metrics (HTTP $HTTP_STATUS):"
                    cat /tmp/response.txt
                    exit 1
                  fi
                  echo "Pushed metrics to $GATEWAY_URL (HTTP $HTTP_STATUS)"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: results
                  mountPath: /results
          containers:
            # Human-readable report: this is what `kubectl logs job/<name> -n kubescape` shows.
            - name: kubescape-report
              image: quay.io/kubescape/kubescape-cli:v4.0.13
              command:
                - kubescape
                - scan
                - --keep-local
                - --host-scan=false
              env:
                - name: HOME
                  value: /home/kubescape
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: home
                  mountPath: /home/kubescape
          volumes:
            - name: results
              emptyDir: {}
            - name: home
              emptyDir: {}
