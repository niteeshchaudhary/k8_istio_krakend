apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubescape
  namespace: kubescape
automountServiceAccountToken: true
---
# Read-only, cluster-wide: kubescape's misconfiguration scan inspects workload
# specs, RBAC and network policy across every namespace. Trimmed from the
# kubescape-operator chart's ClusterRole down to what a plain `kubescape scan`
# needs (no CRD-writing rules, no host-sensor/agent-runtime extras since those
# require the operator, which isn't installed here). Cluster-wide secret
# access is intentionally left out; re-add a "secrets" rule below if the
# secrets-related controls need to run with full visibility.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubescape
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/proxy
      - namespaces
      - nodes
      - configmaps
      - services
      - serviceaccounts
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - limitranges
      - replicationcontrollers
      - podtemplates
      - resourcequotas
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csistoragecapacities"]
    verbs: ["get", "list", "watch"]
  # This cluster runs Istio (see k8s/base/infra/istio) — let kubescape read
  # the mesh's authZ/traffic policy objects too.
  - apiGroups: ["networking.istio.io"]
    resources: ["gateways", "virtualservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubescape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubescape
subjects:
  - kind: ServiceAccount
    name: kubescape
    namespace: kubescape
