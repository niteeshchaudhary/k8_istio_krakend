# Expose the 1.25-mesh backend to the 1.27 control plane so the
# cluster-infra ingress gateway can route /127/api traffic to it.
apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: backend-federation
  namespace: cluster-infra
spec:
  hosts:
    - backend.backend.svc.cluster.local
  ports:
    - number: 8093
      name: http
      protocol: HTTP
  location: MESH_INTERNAL
  resolution: DNS
