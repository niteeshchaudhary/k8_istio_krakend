apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: alloy
      automountServiceAccountToken: true
      securityContext:
        # The image pre-creates /var/lib/alloy owned by its built-in "alloy"
        # user (UID/GID 473), but mounting an emptyDir at /var/lib/alloy/data
        # replaces that with a fresh volume instead. Pin the pod to the same
        # UID/GID (with fsGroup so the mounted volume is writable by it) so
        # Alloy can create its storage dir there regardless.
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
          ports:
            - name: http
              containerPort: 12345
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
