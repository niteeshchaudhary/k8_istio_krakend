apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internal-ingressgateway-argo
  namespace: argocd
  annotations:
    kubernetes.io/ingress.class: internal
spec:
  ingressClassName: internal
  rules:
    - http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
