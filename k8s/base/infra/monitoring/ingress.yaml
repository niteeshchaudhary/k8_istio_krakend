apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internal-ingressgateway
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: internal
spec:
  ingressClassName: internal
  rules:
    - http:
        paths:
          - path: /grafana(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: grafana
                port:
                  number: 80
    - http:
        paths:
          - path: /grafana(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: grafana
                port:
                  number: 80
