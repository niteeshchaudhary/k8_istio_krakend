apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-bench
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/niteeshchaudhary/k8_istio_krakend.git'
    targetRevision: full-working
    path: k8s/overlays/dev/infra/kube-bench
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-bench
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
